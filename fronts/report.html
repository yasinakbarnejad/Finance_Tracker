{% extends "base.html" %}

{% block head %}        
    <link rel="stylesheet" href="/static/report.css">
    <title>
        Finance Report
    </title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

{% endblock %}
{% block content %}
<div class="selection">
    <div class="selector">
    <form action="/select" method="post">
        <span>Select your report type:</span>    
        <span><label for="monthly">Monthly</label> <input type="radio" id="monthly" name="type" value="1"></span>
        <span><label for="annual">Annual</label> <input type="radio" id="annual" name="type" value="2"></span>
        <span><label for="net_worth">Net worth</label> <input type="radio" id="net_worth" name="type" value="3"></span>
        <input type="submit" value="Submit" id="button">
    </form>
    </div>
    {% if type==1 %}
    <div class="month">
    <form action="/api/monthlychart" method="post">
        <label for="months">Month:</label>
        <select id="months" name="months">
            <option value="1">farvardin</option>
            <option value="2">Ordibehesht</option>
            <option value="3">Khordad</option>
            <option value="4">Tir</option>
            <option value="5">Mordad</option>
            <option value="6">Shahrivar</option>
            <option value="7">Mehr</option>
            <option value="8">Aban</option>
            <option value="9">Azar</option>
            <option value="10">Day</option>
            <option value="11">Bahman</option>
            <option value="12">Esfand</option>
        </select>
        <input type="submit" value="Submit" id="button">

    </form>
    </div>
    {% elif type==2 %}
    <form action="/api/annualchart" method="post">
        <input type="number" name="year" id="year">
        <input type="submit" value="Submit" id="button">
    </form>
    {%elif type==3 %}
    <form action="/api/netchart" method="post">
        <script>
        $(document).ready(function () {
            $("#date").pDatepicker({
                format: "YYYY/MM/DD",
                autoClose: true
            });
        });
        </script>
        <input type="text" id="date" name="date" autocomplete="off">
        <input type="submit" value="Submit" id="button">
    </form>
    {% endif %}
</div>
<div class="reports">
    <div id="first_chart">
        {{ chart1 | safe}}
    </div>
    <div id="second_chart">
        {{ chart2 | safe }}
    </div>
    <div id="third_chart">
        {{ chart3 | safe}}
    </div>
</div>
{% endblock %}
