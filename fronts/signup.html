<!DOCTYPE html>
<html>
    <head>
        <title>
            login
        </title>
    </head>
    <body>
        <h1>
            SIGN UP
        </h1>
        <div class="fields">
            <form action="/signup" method="post">
            <label for="fname">Enter your first name</label>
            <input type="text" name="fname" placeholder="Your name..." id="fname" required><br>
            <label for="sname">Enter your surname</label>
            <input type="text" name="sname" placeholder="Your surname..." id="sname" required><br>
            <label for="username">Enter a username</label>
            <input type="text" name="username" placeholder="Your username..." id="name" required><br>
            <label for="password">Enter a password</label>
            <input type="text" name="password" placeholder="your password..." id="password"  required><br>
            <label for="repassword">Enter your password again</label>
            <input type="text" name="repassword" placeholder="your password..." id="repassword"  required><br>
            <label for="net">Enter your net worth</label>
            <input type="text" name="net_worth" placeholder="in Toman" id="net"  required><br>
            <button type="submit">Submit</button><br>
            </form> 
        </div>
        <p>already have account?<a href="/login">log in</a></p>
        {% if error %}
            <p style="color: red;">{{error}}</p>
        {% endif %}
    </body>
</html>
